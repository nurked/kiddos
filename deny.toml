# No network stack may be compiled into KidDOS. Principle 2: nothing is real.
[bans]
multiple-versions = "allow"
deny = [
    { crate = "reqwest" },
    { crate = "hyper" },
    { crate = "tokio" },
    { crate = "mio" },
    { crate = "ureq" },
    { crate = "curl" },
    { crate = "openssl" },
    { crate = "rustls" },
    { crate = "socket2" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "CC0-1.0", "BSL-1.0", "OFL-1.1"]

[advisories]
ignore = []
