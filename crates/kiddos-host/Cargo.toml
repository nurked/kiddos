[package]
name = "kiddos-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The real machine: window, keys, speech, sound, clock, persistence, parent password."

[dependencies]
kiddos-kernel.workspace = true
kiddos-console.workspace = true
kiddos-i18n.workspace = true
winit.workspace = true
