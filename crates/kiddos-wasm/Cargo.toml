[package]
name = "kiddos-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The WASM sandbox: wasmtime with no WASI, only the kiddos import module (the console API)."

[dependencies]
kiddos-kernel.workspace = true
kiddos-console.workspace = true
kiddos-vfs.workspace = true
wasmtime = { version = "40", default-features = false, features = ["cranelift", "runtime", "std", "wat"] }
anyhow = "1"
